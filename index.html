<!DOCTYPE html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
      charset="UTF-8"
    />
    <link rel="icon" type="image/svg+xml" href="./public/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://new.mnaa.cl" crossorigin />
    <link rel="preload" href="/fonts/SupremeLLSub-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SupremeLLSub-Book.woff2" as="font" type="font/woff2" crossorigin />
    <title>Max Núñez Arquitectos</title>
    <!-- Loader de entrada: se pinta desde el primer instante, antes de que cargue el JavaScript.
         React lo oculta (src/context/BootContext.jsx) cuando la primera fila de fotos está lista. -->
    <style>
      html {
        background: #fafafa;
        /* sin barra de scroll: evita que el contenido se desplace al aparecer o desaparecer */
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      html::-webkit-scrollbar {
        display: none;
      }
      @font-face {
        font-family: "supreme-bold";
        src: url("/fonts/SupremeLLSub-Bold.woff2") format("woff2");
        font-display: block;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
      }
      #boot-loader span {
        font-family: "supreme-bold", system-ui, sans-serif;
        /* un poco más grande que el navbar (1rem): ~18 px en móvil, ~21 px en escritorio */
        font-size: clamp(1.05rem, 1rem + 0.4vw, 1.5rem);
        line-height: 1.4;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #242424;
        /* 1) el nombre aparece con un fundido suave */
        animation: boot-in 1s ease-out backwards;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* 2) al terminar: primero se desvanece el nombre, y enseguida aparece la web */
      #boot-loader.hide span {
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #boot-loader.hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease 0.5s;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader span {
          animation: none;
        }
      }
    </style>
    <noscript><style>#boot-loader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Cargando"><span>Max Núñez Arquitectos</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
